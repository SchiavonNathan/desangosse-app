services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_desangosse_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production_with_crypto_random_bytes}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    container_name: app_desangosse_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
